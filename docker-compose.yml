version: '3.8'

services:

  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: exam_2400031389
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_2400031389"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend (CrudService) ──────────────────────
  backend:
    build:
      context: ./backend/CrudService
      dockerfile: Dockerfile
    container_name: mobileapp_backend
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exam_2400031389
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      postgres:
        condition: service_healthy

  # ── React Frontend (Vite + Nginx) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mobileapp_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
